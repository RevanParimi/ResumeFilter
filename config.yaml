# ─────────────────────────────────────────────────────────────────────────────
# depth-eval-engine — non-sensitive configuration (committed to git).
# Read by app/core/config.py (Settings). Keys are field names (NO DEE_ prefix).
#
# Secrets (API keys / tokens) do NOT belong here — they live in .env only.
# Any value below can be overridden per-deploy by the matching DEE_* env var.
# ─────────────────────────────────────────────────────────────────────────────

# --- LLM provider: OpenRouter (OpenAI-compatible) ----------------------------
openrouter_base_url: "https://openrouter.ai/api/v1"
# Optional attribution headers OpenRouter uses for app rankings.
openrouter_app_url: ""
openrouter_app_title: "depth-eval-engine"

# Tiered, config-driven model IDs. Domain/node code asks for a *tier*, never a
# literal model id.
#   reasoning      = plausibility + claim_extraction (override _HARD for hardest)
#   fast (parsing) = cheap structural work
#   bulk           = high-volume gen/classification (future flywheel; unused at M0)
# Live OpenRouter pricing checked 2026-07-26 (USD per 1M in/out):
#   deepseek/deepseek-v3.2   $0.269/$0.400  <- value king, our default reasoning
#   qwen/qwen3.7-max         $1.475/$4.425  <- kept only for reasoning_hard
#   qwen/qwen3.6-flash       $0.188/$1.125  <- fast tier (unchanged)
#   qwen/qwen3.6-35b-a3b     $0.140/$1.000  <- bulk tier (unchanged)
#   moonshotai/kimi-k3       $3.000/$15.00  <- flagship; re-check post-weights drop
model_reasoning: "deepseek/deepseek-v3.2"
model_reasoning_hard: "qwen/qwen3.7-max"
model_fast: "qwen/qwen3.6-flash"
model_bulk: "qwen/qwen3.6-35b-a3b"
llm_max_tokens: 4096
llm_timeout_seconds: 60
llm_max_retries: 2                  # SDK retries w/ backoff before degrading to rules

# --- Future model slots (PI-7 interviews / PI-8 embeddings) --------------------
# INERT today — no code reads these until their sprint lands. Declared now so
# model choices are business-tunable config, not code. Direction + research:
# MODELS.md (2026-07-26). Exact vendor ids re-verified at each sprint's spec.
model_scoring: "deepseek/deepseek-v3.2"   # decisive interview-scoring (S7.3);
                                          # advisory + human-reviewed, so value
                                          # tier is right; kimi-k3 if quality demands
speech_provider: "openrouter"         # openrouter (existing account, cheapest dev
                                      # path) | sarvam (India-hosted, DPDP residency
                                      # for prod) | local (self-host GPU, PI-8)
asr_model: "mistralai/voxtral-small-24b-2507"  # $0.10/$0.30, open-weights ASR on
                                      # OpenRouter; alt google/gemini-2.5-flash-lite
                                      # (~$0.03-0.10/hr audio); local = qwen3-asr-1.7b;
                                      # sarvam = "saarika" family
tts_model: "kokoro-82m"               # local, free, Indian-English preset (OpenRouter
                                      # has no TTS); hosted alt = sarvam "bulbul"
embedding_model: "qwen/qwen3-embedding-0.6b"   # PI-8; 8B variant = quality bump
reranker_model: "qwen/qwen3-reranker-0.6b"     # optional PI-5/8 search quality

# --- GitHub (provenance; first-party URLs the candidate shares only) ----------
# NOTE: the TOKEN is a secret and lives in .env, not here.
github_api_base: "https://api.github.com"

# --- Vector store (ChromaDB) -------------------------------------------------
# backend: chroma | memory. Chroma init is bounded — if it hangs/fails, the
# service starts anyway with the in-memory store (grounding is best-effort).
vectorstore_backend: "chroma"
vectorstore_init_timeout_seconds: 15
chroma_persist_dir: "./.chroma"
chroma_collection: "depth-eval-evidence"

# --- Flywheel (training-data sink) -------------------------------------------
flywheel_path: "./data/flywheel.jsonl"

# --- Report store (durable reports + human outcome records; SQLite) -----------
report_db_path: "./data/reports.db"

# --- Candidates (PI-1) ---------------------------------------------------------
# Salt for contact dedup hashes (email/phone). Stable across deploys; NOT a secret.
contact_hash_salt: "veritas-dedup-v1"
# SQLAlchemy URL for the candidate store (S1.2; SQLAlchemy + Alembic).
# Postgres later = change this string and run `alembic upgrade head`.
candidates_db_url: "sqlite:///./data/veritas.db"

# --- Calibration (CONSERVATIVE: false positives are the existential risk) -----
# A claim is flagged INCOHERENT only when coherence is low AND confidence is high
# enough to act; otherwise we DEFER to a human. Never auto-reject.
flag_coherence_threshold: 0.35      # below this = potentially incoherent
flag_min_confidence: 0.70           # need this much confidence to flag at all
defer_confidence_threshold: 0.50    # below this = defer to human, never assert

# --- Fabrication defense (PI-2) — S2.1 AI-generated-resume signals ------------
# ADVISORY bands over stylistic tells. AI-assisted resume writing is common and
# legitimate; these thresholds only pick the band shown to a human reviewer.
# "likely" additionally requires >=2 independent deterministic tells.
ai_likely_threshold: 0.65        # fused likelihood >= this -> band "likely"
ai_possible_threshold: 0.40      # fused likelihood >= this -> band "possible"
ai_min_confidence: 0.50          # below this we say "insufficient_text", never assert
ai_llm_excerpt_chars: 6000       # resume prefix sent to the LLM stylometry pass

# --- Fabrication defense (PI-2) — S2.2 cross-field forensics -------------------
# Deterministic date/structure checks over the extracted profile. ADVISORY:
# findings are observations for a reviewer to probe, never a rejection signal.
xf_min_confidence: 0.50          # below this -> band "insufficient_data"
xf_overlap_months_min: 3         # concurrent primary roles flagged at >= this many months
xf_gap_months_min: 12            # gaps flagged at >= this (always minor/context)
xf_edu_overlap_months_min: 12    # primary work inside a bachelor's flagged at >= this
xf_senior_min_months: 24         # "senior" below this career span -> minor finding
xf_lead_min_months: 48           # lead/principal/head+ below this span -> major finding

# --- Fabrication defense (PI-2) — S2.3 resume-farm detection -------------------
# Deterministic MinHash over contact-masked word shingles, compared across
# candidates at ingest. ADVISORY: shared templates are common and legitimate.
rf_shingle_words: 3              # words per shingle
rf_num_permutations: 128         # signature size (stderr of estimate ~ 1/sqrt(n))
rf_min_shingles: 40              # below this -> band "insufficient_data"
rf_similar_threshold: 0.60       # estimated overlap to count as a match at all
rf_near_dup_threshold: 0.80      # any match >= this -> band "near_duplicate"
rf_cluster_candidates_min: 3     # matches from >= this many other candidates -> near_duplicate
rf_max_matches: 10               # matches carried on the assessment (best first)

# --- Fabrication defense (PI-2) — S2.4 unified fabrication risk ----------------
# Deterministic fusion of the three fabrication signals into one advisory band,
# computed in the calibration stage. Never changes verdicts or depth scores;
# "moderate" additionally requires a flagged subsystem or >=2 non-clean ones,
# "elevated" additionally requires >=2 subsystems at their top band.
fr_moderate_threshold: 0.30      # fused score >= this (AND gate above) -> "moderate"
fr_elevated_threshold: 0.60      # fused score >= this (AND >=2 flags) -> "elevated"
fr_min_confidence: 0.50          # below this -> "insufficient_data", never assert
fr_weight_ai: 1.0                # per-subsystem fusion weights (x component confidence).
fr_weight_cross_field: 1.0       # NOTE: weights scale the mean term only — weight 0 does
fr_weight_farm: 1.0              # NOT mute a subsystem (max term/coverage still count)

# --- Evaluation ledger (PI-3) — S3.1 schema + DPDP consent ---------------------
# Consent grants are purpose-scoped, org-scoped, revocable, and ALWAYS expire:
# grants created without an explicit expiry get this TTL (days). No perpetual
# consent. Purpose/stage/outcome taxonomies are code constants, not config.
ledger_consent_default_ttl_days: 365
ledger_api_key_bytes: 32

# --- Cross-company reputation (PI-3, S3.4): advisory aggregation ---------------
# Beta-Binomial posterior over interview + coding evidence, shrunk toward a
# neutral prior, recency-decayed, per-org reliability weighted. Advisory only:
# never auto-rejects. Outcome->value map is a code constant, not config.
rep_prior_mean: 0.5              # Beta prior mean (neutral: no assumption)
rep_prior_strength: 4.0          # prior pseudo-count; higher = more shrinkage
rep_recency_halflife_days: 365   # age at which an outcome's weight halves
rep_min_confidence: 0.50         # below this -> insufficient_data, never assert
rep_confidence_k: 4.0            # evidence mass where confidence = 0.5
rep_confidence_cap: 0.90         # confidence ceiling
rep_corroboration_orgs: 2        # distinct orgs required for STRONG / GUARDED
rep_strong_threshold: 0.75       # score >= this (AND corroborated) -> strong
rep_favorable_threshold: 0.60    # score >= this -> favorable
rep_guarded_threshold: 0.35      # score <= this (AND corroborated) -> guarded
rep_interview_weight: 1.0        # interview-record evidence type weight
rep_coding_weight: 1.0           # coding-round evidence type weight

# --- ML feature store (PI-4) - S4.1 feature registry --------------------------
feat_default_view: core_v1      # default FeatureView name (all seed features)

# --- ML feature store (PI-4) - S4.3 talent search / ranking -------------------
search_default_limit: 50        # default page size for POST /talent/search

# --- API hardening -------------------------------------------------------------
# Input caps so a hostile/buggy client can't OOM the service. The optional
# API auth key is a SECRET and lives in .env (DEE_API_AUTH_KEY), never here.
max_resume_chars: 200000
max_pdf_b64_chars: 14000000        # ~10 MB PDF once base64-decoded

# --- Service -----------------------------------------------------------------
log_level: "INFO"
log_json: true                      # true = JSON logs (prod); false = console (dev)
env: "local"                        # local | staging | prod
